# Mischief Next Door CI (TECH §12): import metadata → GDScript tests → design lints → solver routes
# for every `final` episode → bounded fairness fuzz, plus the Python checks (art validators, audio).
# The Python job needs numpy + Pillow and `rsvg-convert` (apt `librsvg2-bin`, not on the ubuntu-24.04
# image): the art validators rasterise every SVG part with it to check pivots, ink and silhouettes.
# Every step passes on an empty-but-valid repo: a module that doesn't exist yet is SKIPPED with a
# clear log line by the script itself (solve/fuzz/lint print "SKIP: …" and exit 0).
# The Android preview APK lives in android-preview.yml (untouched here).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  # All Godot steps share one sandbox so the import runs once.
  SANDBOX: ci

jobs:
  godot:
    name: Godot tests, lints, solver, fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Import metadata is committed (.import / .uid sidecars)
        run: tools/ci/check_import_meta.sh
      - name: GDScript test suite
        run: tools/scripts/test_game.sh ci
      - name: Design lints (content, hotspot, IP; anim/rig when present)
        run: tools/scripts/lint.sh
      - name: Solver — every route of every final episode (expects, invariants, determinism)
        run: |
          mkdir -p build/solver
          tools/scripts/solve.sh all --route=all --report="$PWD/build/solver/solve.json"
      - name: Fairness fuzz — 20 seeded runs per bot per final episode
        run: tools/scripts/fuzz.sh all --runs=20 --report="$PWD/build/solver/fuzz.json"
      - name: Upload solver reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-reports
          path: build/solver
          if-no-files-found: ignore
          retention-days: 14

  python-checks:
    name: Art validators + audio check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy + pillow
        run: python3 -m pip install --quiet numpy pillow
      - name: Install rsvg-convert (librsvg2-bin; the art validators rasterise SVG parts with it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin
          rsvg-convert --version
      - name: Art validators and gen_audio.py --check (each skipped when absent)
        run: tools/ci/lint_all.sh --no-godot
